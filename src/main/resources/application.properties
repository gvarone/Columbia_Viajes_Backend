spring.application.name=viajes

# Valores locales y secretos: se leen de un archivo .env en la raiz del proyecto
# (ignorado por git; usar .env.example como plantilla) o de variables de entorno.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/columbia_viajes}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Spring Security + JWT ---
# Clave secreta para firmar los tokens JWT (HMAC-SHA256).
app.jwt.secret=${JWT_SECRET}
# Tiempo de expiraci\u00c3\u00b3n del token en milisegundos (24 horas = 86400000 ms)
app.jwt.expiration-ms=900000

# Imagenes de paquetes
app.imagenes.directorio=uploads/paquetes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB